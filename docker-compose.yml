services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cms_php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - cms_network
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}

  nginx:
    image: nginx:1.27-alpine
    container_name: cms_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cms_network
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: cms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXPOSE_PORT:-3306}:3306"
    volumes:
      - cms_mysql_data:/var/lib/mysql
    networks:
      - cms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  composer:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cms_composer
    working_dir: /var/www/html
    entrypoint: ["composer"]
    command: ["install"]
    volumes:
      - .:/var/www/html
    networks:
      - cms_network
    profiles:
      - tools

volumes:
  cms_mysql_data:
    driver: local

networks:
  cms_network:
    driver: bridge
